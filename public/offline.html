<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — The Last Line</title>
    <style>
      :root {
        --navy: #0b2545;
        --orange: #f26419;
        --grey: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        background: linear-gradient(180deg, #ffffff, #f1f5f9);
        color: var(--navy);
        text-align: center;
      }
      .card {
        max-width: 28rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--grey);
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 9999px;
        background: var(--orange);
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/favicons/favicon-192x192.png" alt="The Last Line" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Impossible de charger cette page pour le moment. Vérifiez votre
        connexion internet, puis réessayez.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
